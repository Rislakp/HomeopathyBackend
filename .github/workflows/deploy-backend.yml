name: Deploy HomeopathyBackend to AWS EC2

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: homeopathy-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951928130471:role/GitHubActions-Backend-Deploy
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy Backend Through SSM
        shell: bash
        env:
          INSTANCE_ID: i-0acffa73f1930a10e
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<'REMOTE'
          set -Eeuo pipefail

          cd /home/ec2-user/HomeopathyBackend

          echo "Fetching latest code..."
          git fetch origin master

          echo "Preserving EC2-only local changes..."
          git stash push -u -m "pre-auto-deploy-$(date +%Y%m%d%H%M%S)"

          echo "Switching to the latest master code..."
          git checkout master
          git reset --hard origin/master

          echo "Installing production dependencies..."
          npm ci --omit=dev

          echo "Restarting backend..."
          pm2 restart ptblync-backend --update-env

          echo "Checking backend health..."
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:5000/api/health; then
              echo
              echo "Backend health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed."
          pm2 logs ptblync-backend --lines 50 --nostream || true
          exit 1
          REMOTE
          )

          SCRIPT_B64=$(printf '%s' "$DEPLOY_SCRIPT" | base64 -w 0)

          REMOTE_COMMAND="echo ${SCRIPT_B64} | base64 -d > /tmp/homeopathy-deploy.sh && chmod 755 /tmp/homeopathy-deploy.sh && sudo -iu ec2-user bash -lc 'bash /tmp/homeopathy-deploy.sh'"

          PARAMETERS=$(jq -cn --arg cmd "$REMOTE_COMMAND" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text || true
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true
                echo "Deployment failed: $STATUS" >&2
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the EC2 deployment."
          exit 1
